name: navi_x_istanbul
description: İstanbul'un Navigasyonu-Navi X

publish_to: 'none'

version: 2.0.0+46

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  flutter_tts: ^3.8.5
  speech_to_text: ^7.0.0          # ← 6.6.2 yerine 7.x kullan (Google Play uyumluluk)
  shared_preferences: ^2.2.2
  http: ^1.1.0
  url_launcher: ^6.2.2
  flutter_local_notifications: ^18.0.1
  intl: ^0.19.0
  #google_mobile_ads: ^4.0.0
  cupertino_icons: ^1.0.2
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4   # ← Tırnak işaretleri kaldırıldı

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon.png

# ========== UYGULAMA İKONU YAPILANDIRMASI ==========
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#02040A"
  adaptive_icon_foreground: "assets/icon.png"

  platforms:
    ios:
      deployment-target: '15.0'