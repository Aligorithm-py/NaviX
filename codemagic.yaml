workflows:
  default-workflow:
    name: Default Workflow
    environment:
      flutter: stable
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Disable Swift Package Manager to fix CocoaPods conflict
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Build iOS IPA
        script: |
          flutter build ipa --release
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true