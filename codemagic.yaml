workflows:
  default-workflow:
    name: Default Workflow
    environment:
      flutter: stable
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Disable Swift Package Manager to fix CocoaPods conflict
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign