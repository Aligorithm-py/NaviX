workflows:
  default-workflow:
    name: Default Workflow
    environment:
      flutter: 3.24.3
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.aligorithm.istanbulNavigasyon
    scripts:
      - name: Force Clean Everything (Cache Bypass)
        script: |
          rm -rf build/
          rm -rf ios/Pods/
          rm -rf ios/.symlinks/
          flutter clean
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Generate launcher icons
        script: |
          flutter pub run flutter_launcher_icons:main
      - name: Disable Swift Package Manager to fix CocoaPods conflict
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Set up code signing settings
        script: |
          app-store-connect fetch-signing-files com.aligorithm.istanbulNavigasyon --create --type IOS_APP_STORE --platform IOS --issuer-id 392f0cdf-666f-4e72-9869-83b25e0c5e08 --key-id 2HT9RK6864 --private-key @env:AUTH_KEY --certificate-key @env:CERTIFICATE_KEY
      - name: Build iOS Release IPA
        script: |
          flutter build ipa --release --build-name=2.0.0 --build-number=59
      - name: Publish to TestFlight via App Store Connect API
        script: |
          xcrun altool --upload-app --type ios -f build/ios/ipa/*.ipa --apiKey 2HT9RK6864 --apiIssuer 392f0cdf-666f-4e72-9869-83b25e0c5e08
    artifacts:
      - build/ios/ipa/*.ipa
      - build/app/outputs/bundle/release/*.aab