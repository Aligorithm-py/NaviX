workflows:
  default-workflow:
    name: Default Workflow
    environment:
      flutter: stable
      vars:
        # Eğer entegre ettiğin API key için bir isim verdiysen buraya yazabilirsin,
        # boş bırakırsan varsayılan bağlı olan integration anahtarını kullanır.
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Disable Swift Package Manager to fix CocoaPods conflict
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Build iOS IPA Release
        script: |
          flutter build ipa --release --no-codesign
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true