workflows:
  default-workflow:
    name: Default Workflow
    environment:
      flutter: 3.24.3
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.aligorithm.istanbulNavigasyon
    scripts:
      - name: Force Clean Everything (Cache Bypass)
        script: |
          rm -rf build/
          rm -rf ios/Pods/
          rm -rf ios/.symlinks/
          flutter clean
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Generate launcher icons
        script: |
          flutter pub run flutter_launcher_icons:main
      - name: Disable Swift Package Manager to fix CocoaPods conflict
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Set up code signing settings
        script: |
          app-store-connect fetch-signing-files
      - name: Build iOS Release IPA
        script: |
          flutter build ipa --release --build-name=2.0.0 --build-number=58
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true