workflows:
  default-workflow:
    name: Default Workflow
    environment:
      flutter: stable
    scripts:
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Install Dependencies
        script: |
          flutter pub get
      - name: Build iOS
        script: |
          flutter build ipa --release --no-codesign