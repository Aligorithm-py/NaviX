workflows:
  default-workflow:
    name: Default Workflow
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.aligorithm.istanbulNavigasyon
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Generate launcher icons
        script: |
          flutter pub run flutter_launcher_icons:main
      - name: Disable Swift Package Manager to fix CocoaPods conflict
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Clean Flutter cache
        script: |
          flutter clean
      - name: Clean Android build cache
        script: |
          cd android && ./gradlew clean && cd ..
      - name: Build iOS IPA Release
        script: |
          flutter build ipa --release --build-name=2.0.0 --build-number=47
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true