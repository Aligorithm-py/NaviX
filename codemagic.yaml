workflows:
  default-workflow:
    name: Default Workflow
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.aligorithm.istanbulNavigasyon
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Generate launcher icons
        script: |
          flutter pub run flutter_launcher_icons:main
      - name: Disable Swift Package Manager to fix CocoaPods conflict
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Clean Flutter cache
        script: |
          flutter clean
      - name: Build iOS Release via Xcode
        script: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath $HOME/Library/Developer/Xcode/Archives/Runner.xcarchive \
                     archive
          xcodebuild -exportArchive \
                     -archivePath $HOME/Library/Developer/Xcode/Archives/Runner.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath $HOME/Library/Developer/Xcode/DerivedData/Build/Intermediates.noindex/ArchiveIntermediates/Runner/InstallationProductsPath/Applications/
          cd ..
        publishing:
        app_store_connect:
          auth: integration
          submit_to_testflight: true